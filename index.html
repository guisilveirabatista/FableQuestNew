<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fable Quest — RM2k3 RTP demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas {
    /* the game sizes its internal resolution to the window's aspect ratio,
       so stretching to 100vw/100vh keeps pixels square — and no black bars */
    display: block;
    width: 100vw; height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="screen" width="640" height="400"></canvas>
<script src="assets/music.js"></script>
<script src="midi.js"></script>
<script src="game.js"></script>
</body>
</html>
