<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fable Quest MZ</title>
<style>
  @font-face {
    font-family: 'GameFont';
    src: url('assets/fonts/mplus-1m-regular.woff') format('woff');
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas {
    /* the game sizes its internal resolution to the window's aspect ratio,
       so stretching to 100vw/100vh keeps pixels square — and no black bars.
       The backing store is 3x the logical size so the 48px MZ art stays
       sharp; default (smooth) scaling fits its painterly look. */
    display: block;
    width: 100vw; height: 100vh;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="screen" width="640" height="400"></canvas>
<script src="midi.js"></script>
<!-- Browser-side definitions and prediction helpers, then the network client. -->
<script src="sim.js"></script>
<script src="client.js"></script>
<script src="netclient.js"></script>
<!-- Social UI: chat, party, trade, PvP. -->
<script src="netsocial.js"></script>
<script src="netadmin.js"></script>
</body>
</html>
